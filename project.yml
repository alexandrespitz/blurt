name: Blurt

options:
  bundleIdPrefix: com.alexspitz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.5

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Blurt:
    type: application
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/Services
      - path: Sources/App
      - path: Sources/UI
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexspitz.blurt
        PRODUCT_NAME: Blurt
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Generated/Blurt-Info.plist
      properties:
        CFBundleName: Blurt
        CFBundleDisplayName: Blurt
        CFBundleIconFile: AppIcon
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "MIT licensed. Local-only dictation — no audio or text leaves this Mac."
        NSMicrophoneUsageDescription: "Blurt records audio only while you dictate, and transcribes it entirely on this Mac."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false

  BlurtCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/Services
      - path: Sources/CLI
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_NAME: blurt-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.alexspitz.blurt.cli

  BlurtTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexspitz.blurt.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Blurt:
    build:
      targets:
        Blurt: all
        BlurtCLI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlurtTests
  BlurtCLI:
    build:
      targets:
        BlurtCLI: all
    run:
      config: Debug
